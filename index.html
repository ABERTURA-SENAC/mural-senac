<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mural da Turma — Telão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0f1229;
    --navy2: #161b3a;
    --blue: #3b6bff;
    --teal: #00c9a7;
    --amber: #ffc045;
    --pink: #ff6b9d;
    --purple: #9b6dff;
    --text: #f0f2ff;
    --text2: #9ba3cc;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--navy);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }

  /* PARTÍCULAS */
  #bg-canvas {
    position: fixed; top:0; left:0; width:100%; height:100%;
    pointer-events: none; z-index: 0; opacity: .4;
  }

  /* LAYOUT PRINCIPAL */
  .telao-wrap {
    position: relative; z-index: 1;
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    padding: 1.5rem;
    gap: 1rem;
  }

  /* HEADER */
  .telao-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .75rem 1.25rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    backdrop-filter: blur(10px);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-logo {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--blue), var(--teal));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .header-title { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800; }
  .header-sub { font-size: 12px; color: var(--text2); }

  .header-right { display: flex; align-items: center; gap: 16px; }

  .count-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 20px;
    background: rgba(59,107,255,0.15);
    border: 1px solid rgba(59,107,255,0.3);
    font-size: 13px; font-weight: 600; color: var(--blue);
  }
  .count-num {
    font-family: 'Syne', sans-serif;
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--teal);
    min-width: 28px;
  }

  .live-dot {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--teal);
  }
  .live-dot::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--teal);
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ÁREA DO MURAL */
  .mural-area {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 1rem;
    height: 100%;
    overflow: hidden;
  }

  /* POSTS GRID */
  .posts-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-content: flex-start;
    overflow-y: auto;
    padding: 4px 4px 4px 0;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.1) transparent;
  }

  .post-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 1rem 1.1rem;
    width: calc(33.33% - 9px);
    min-width: 180px;
    position: relative;
    overflow: hidden;
    animation: card-in .55s cubic-bezier(.34,1.56,.64,1) both;
    flex-shrink: 0;
  }
  @media(max-width:1200px) { .post-card { width: calc(50% - 6px); } }

  .post-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
  }
  .post-card::after {
    content: '';
    position: absolute;
    bottom: -30px; right: -30px;
    width: 80px; height: 80px;
    border-radius: 50%;
    opacity: .06;
  }

  @keyframes card-in {
    from { transform: scale(.7) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .post-emoji { font-size: 22px; margin-bottom: 6px; }
  .post-connection {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
    opacity: .85;
  }
  .post-text {
    font-size: 13px;
    color: rgba(240,242,255,.8);
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .post-footer {
    display: flex; align-items: center;
    justify-content: space-between;
  }
  .post-names { font-size: 11px; color: rgba(155,163,204,.7); }

  /* SIDEBAR */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
  }

  /* QR CODE BOX */
  .qr-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 1.25rem;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .qr-box-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  #qr-container {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: .75rem;
  }
  #qr-container canvas, #qr-container img { border-radius: 6px; }
  .qr-url {
    font-size: 10px;
    color: var(--text2);
    word-break: break-all;
    line-height: 1.4;
  }

  /* STATS BOX */
  .stats-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 1.25rem;
    flex: 1;
    overflow: hidden;
  }
  .stats-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .stat-row {
    display: flex; align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .stat-icon { font-size: 16px; width: 24px; text-align: center; }
  .stat-info { flex: 1; min-width: 0; }
  .stat-label { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-val { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: .75rem 0; }

  .big-count {
    text-align: center;
    padding: .5rem 0;
  }
  .big-count .num {
    font-family: 'Syne', sans-serif;
    font-size: 3rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--blue), var(--teal));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .big-count .label { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* CONTROLES DOCENTE */
  .controls-bar {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    display: flex;
    gap: 8px;
    z-index: 100;
  }
  .ctrl {
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(15,18,41,.9);
    color: var(--text);
    backdrop-filter: blur(10px);
    transition: all .15s;
  }
  .ctrl:hover { background: rgba(255,255,255,.1); }
  .ctrl.danger { border-color: rgba(255,107,157,.3); color: var(--pink); }
  .ctrl.danger:hover { background: rgba(255,107,157,.1); }

  /* EMPTY STATE */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text2);
    gap: 12px;
    padding: 3rem;
  }
  .empty-state .icon { font-size: 48px; opacity: .4; }
  .empty-state p { font-size: 14px; line-height: 1.6; max-width: 300px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 5rem; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,201,167,.15);
    border: 1px solid rgba(0,201,167,.3);
    color: var(--teal);
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="telao-wrap">
  <!-- HEADER -->
  <div class="telao-header">
    <div class="header-left">
      <div class="header-logo">✦</div>
      <div>
        <div class="header-title">Mural da Turma</div>
        <div class="header-sub">Técnico em Administração — SENAC SP</div>
      </div>
    </div>
    <div class="header-right">
      <div class="live-dot">ao vivo</div>
      <div class="count-badge">
        <span>conexões</span>
        <span class="count-num" id="count-num">0</span>
      </div>
    </div>
  </div>

  <!-- ÁREA PRINCIPAL -->
  <div class="mural-area">

    <!-- POSTS -->
    <div class="posts-grid" id="posts-grid">
      <div class="empty-state" id="empty-state">
        <div class="icon">💬</div>
        <p>Aguardando as primeiras conexões…<br>Peça para a turma escanear o QR code!</p>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <!-- QR CODE -->
      <div class="qr-box">
        <div class="qr-box-title">Escaneie para participar</div>
        <div id="qr-container"></div>
        <div class="qr-url" id="qr-url-label"></div>
      </div>

      <!-- STATS -->
      <div class="stats-box">
        <div class="stats-title">Conexões da turma</div>
        <div class="big-count">
          <div class="num" id="stat-total">0</div>
          <div class="label">publicações no mural</div>
        </div>
        <div class="divider"></div>
        <div id="recent-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- CONTROLES DOCENTE -->
<div class="controls-bar">
  <button class="ctrl" onclick="togglePausa()">⏸ Pausar</button>
  <button class="ctrl danger" onclick="limparMural()">🗑 Limpar mural</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── PARTÍCULAS ──
(function(){
  const c=document.getElementById('bg-canvas');
  const ctx=c.getContext('2d');
  let W,H,pts;
  const COLORS=['#3b6bff','#00c9a7','#ffc045','#ff6b9d','#9b6dff'];
  function resize(){ W=c.width=window.innerWidth; H=c.height=window.innerHeight; }
  function init(){
    resize();
    pts=Array.from({length:Math.floor(W*H/18000)},()=>({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3,
      r:Math.random()*1.5+.5,
      color:COLORS[Math.floor(Math.random()*COLORS.length)],
      alpha:Math.random()*.4+.1
    }));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color; ctx.globalAlpha=p.alpha; ctx.fill(); ctx.globalAlpha=1;
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',()=>{resize();init();});
  init(); draw();
})();

// ── QR CODE ──
const ALUNO_URL = 'https://abertura-senac.github.io/mural-senac/mural_aluno.html';
const qrLabel = document.getElementById('qr-url-label');
qrLabel.textContent = ALUNO_URL;

try {
  new QRCode(document.getElementById('qr-container'), {
    text: ALUNO_URL,
    width: 160, height: 160,
    colorDark: '#0f1229',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
} catch(e) {
  // Fallback: mostrar URL
  document.getElementById('qr-container').innerHTML =
    `<div style="padding:1rem;font-size:11px;color:#666;word-break:break-all">${ALUNO_URL}</div>`;
}

// ── DADOS & SINCRONIZAÇÃO (Firebase Realtime Database) ──
const FIREBASE_URL = 'https://mural-senac-bf1ce-default-rtdb.firebaseio.com';
let posts = [];
let pausado = false;
let lastCheck = 0;

async function carregarPosts() {
  try {
    const res = await fetch(FIREBASE_URL + '/posts.json');
    const data = await res.json();
    if (!data) return [];
    return Object.values(data);
  } catch(e) { return []; }
}

async function limparPostsRemoto() {
  try { await fetch(FIREBASE_URL + '/posts.json', { method: 'DELETE' }); } catch(e){}
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function renderPost(post, prepend=false) {
  const grid = document.getElementById('posts-grid');
  document.getElementById('empty-state').style.display='none';

  const card = document.createElement('div');
  card.className = 'post-card';
  card.id = 'post-'+post.id;
  card.style.setProperty('--c', post.cor);
  card.style.background = post.cor+'12';
  card.style.borderColor = post.cor+'33';

  // Barra de cor no topo
  const bar = document.createElement('div');
  bar.style.cssText = `position:absolute;top:0;left:0;width:100%;height:3px;background:${post.cor};border-radius:16px 16px 0 0`;
  card.appendChild(bar);

  // Glow de fundo
  const glow = document.createElement('div');
  glow.style.cssText = `position:absolute;bottom:-30px;right:-30px;width:80px;height:80px;border-radius:50%;background:${post.cor};opacity:.06`;
  card.appendChild(glow);

  card.innerHTML += `
    <div class="post-emoji">${post.emoji}</div>
    ${post.colega ? `<div class="post-connection" style="color:${post.cor}">${post.nome} × ${post.colega}</div>` : `<div class="post-connection" style="color:${post.cor}">${post.nome}</div>`}
    <div class="post-text">${escapeHtml(post.comum)}</div>
    <div class="post-footer">
      <span class="post-names">${new Date(post.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>
    </div>
  `;

  if(prepend && grid.firstChild) {
    grid.insertBefore(card, grid.firstChild);
  } else {
    grid.appendChild(card);
  }

  // Auto-scroll
  if(prepend) grid.scrollTop = 0;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function atualizarStats() {
  const total = posts.length;
  document.getElementById('count-num').textContent = total;
  document.getElementById('stat-total').textContent = total;

  // Recentes
  const recentes = [...posts].sort((a,b)=>b.ts-a.ts).slice(0,5);
  document.getElementById('recent-list').innerHTML = recentes.map(p=>`
    <div class="stat-row">
      <span class="stat-icon">${p.emoji}</span>
      <div class="stat-info">
        <div class="stat-val">${escapeHtml(p.nome)}${p.colega?` × ${escapeHtml(p.colega)}`:''}</div>
        <div class="stat-label">${escapeHtml(p.comum.slice(0,45))}${p.comum.length>45?'…':''}</div>
      </div>
    </div>
  `).join('');
}

async function sincronizar() {
  if(pausado) return;
  const saved = await carregarPosts();
  const novos = saved.filter(s => !posts.find(p=>p.id===s.id));
  novos.forEach(p => {
    posts.push(p);
    renderPost(p, true);
    toast(`✦ ${p.nome} publicou no mural!`);
  });
  if(novos.length) atualizarStats();
}

function togglePausa() {
  pausado = !pausado;
  document.querySelector('.ctrl:not(.danger)').textContent = pausado ? '▶ Retomar' : '⏸ Pausar';
  toast(pausado ? 'Mural pausado' : 'Mural retomado');
}

function limparMural() {
  if(!confirm('Limpar todos os posts do mural?')) return;
  posts = [];
  limparPostsRemoto();
  const grid = document.getElementById('posts-grid');
  grid.innerHTML = `<div class="empty-state" id="empty-state"><div class="icon">💬</div><p>Aguardando as primeiras conexões…<br>Peça para a turma escanear o QR code!</p></div>`;
  atualizarStats();
  toast('Mural limpo');
}

// Verificar atualizações a cada 1.5s
setInterval(sincronizar, 1500);
sincronizar(); // verificar imediatamente ao abrir
</script>
</body>
</html>
