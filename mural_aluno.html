<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Entrar na roleta — Dinâmica de Abertura</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1f3c;
    color: #f0f2ff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    background: rgba(59,107,255,0.12);
    color: #5c85ff;
    border: 1px solid rgba(59,107,255,0.35);
    margin-bottom: 1rem;
  }
  h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: .5rem; }
  p.sub { color: #9ba3cc; font-size: .9rem; margin-bottom: 1.75rem; line-height: 1.5; }
  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    color: #f0f2ff;
    outline: none;
    margin-bottom: 1rem;
  }
  input:focus { border-color: #3b6bff; }
  input::placeholder { color: #9ba3cc; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #3b6bff, #00c9a7);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .5; }
  .err { color: #ff6b9d; font-size: 13px; margin: -0.5rem 0 1rem; display: none; }
  .success { display: none; }
  .success.show { display: block; }
  .form.hide { display: none; }
  .check { font-size: 42px; margin-bottom: .75rem; }
  .nome-confirmado { font-size: 1.2rem; font-weight: 800; color: #00c9a7; margin-bottom: .5rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">SENAC SP</div>

    <div class="form" id="formArea">
      <h1>Quem sou eu aqui?</h1>
      <p class="sub">Digite seu nome para entrar na roleta de apresentações.</p>
      <input id="nomeInput" type="text" placeholder="Seu nome" autocomplete="off" onkeydown="if(event.key==='Enter')enviar()">
      <div class="err" id="erro">Digite seu nome antes de continuar.</div>
      <button id="btnEnviar" onclick="enviar()">Entrar na roleta</button>
    </div>

    <div class="success" id="successArea">
      <div class="check">✦</div>
      <div class="nome-confirmado" id="nomeConfirmado"></div>
      <p class="sub">Você está na roleta! Aguarde ser chamado no telão.</p>
    </div>
  </div>

<script>
  const FIREBASE_URL = 'https://mural-senac-bf1ce-default-rtdb.firebaseio.com';

  function enviar() {
    const inp = document.getElementById('nomeInput');
    const erro = document.getElementById('erro');
    const nome = inp.value.trim();
    if (!nome) { erro.style.display = 'block'; return; }
    erro.style.display = 'none';

    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const id = Date.now() + '_' + Math.random().toString(36).slice(2, 8);

    fetch(FIREBASE_URL + '/roleta_alunos/' + id + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome: nome, ts: Date.now() })
    })
      .then(() => {
        document.getElementById('nomeConfirmado').textContent = nome;
        document.getElementById('formArea').classList.add('hide');
        document.getElementById('successArea').classList.add('show');
      })
      .catch(() => {
        btn.disabled = false;
        btn.textContent = 'Entrar na roleta';
        erro.textContent = 'Não foi possível enviar. Tente novamente.';
        erro.style.display = 'block';
      });
  }
</script>
</body>
</html>
